<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 80" width="100%" height="100%">
  <style>
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; rx: 8px; }
    .search-icon { fill: #57606a; }

    /* Typing Animation Setup */
    .typing-container {
      font-family: ui-monospace, SFMono-Regular, SF Pro Text, monospace;
      font-size: 16px;
      color: #24292f;
      display: flex;
      align-items: center;
    }
    .typing-text {
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      animation: typing 2.5s steps(35, end) forwards;
    }
    .cursor {
      color: #0969da;
      font-weight: bold;
      animation: blink 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 305px; } /* Increased to fully uncover the entire text */
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Automatic Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #30363d; }
      .search-icon { fill: #8b949e; }
      .typing-container { color: #c9d1d9; }
      .cursor { color: #2f81f7; }
    }
  </style>

  <!-- Search Bar Container -->
  <rect x="10" y="15" width="630" height="45" class="panel" />
  
  <!-- Search Icon Magnifying Glass -->
  <path d="M28 27.5 a 4.5 4.5 0 1 1 9 0 a 4.5 4.5 0 1 1 -9 0 M35 31 L39 35" stroke="currentColor" stroke-width="2" fill="none" class="search-icon" />

  <!-- Animated Typing Input -->
  <foreignObject x="50" y="27" width="560" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" class="typing-container">
      <div class="typing-text">find --developer "<span style="color: #0969da; font-weight: bold;">Aasish B Vijayan</span>"</div>
      <div class="cursor">|</div>
    </div>
  </foreignObject>
</svg>
